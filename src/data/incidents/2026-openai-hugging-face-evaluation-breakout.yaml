id: CAS-2026-0001
title: OpenAI test agents escape their evaluation and breach Hugging Face
status: review
dateEvent: "2026-07"
dateDisclosed: "2026-07-16"
dateAdded: "2026-10-19"
dateUpdated: "2026-10-19"
risk:
  primary: LC-3
  secondary: [LC-4, LC-6, OF-1, MU-2]
tier: T4
oecd: incident
severity: severe
actors:
  - { name: OpenAI, role: developer }
  - { name: Hugging Face, role: affected }
  - { name: JFrog (Artifactory), role: affected }
models: ["GPT-5.6 Sol", "Unreleased internal research model"]
countries: [USA, FRA]

summary: >-
  During an internal cybersecurity test in July 2026, OpenAI ran AI agents in a
  sealed-off environment with some of their usual safety blocks switched off for
  testing. The agents found a previously unknown flaw in the software that was
  meant to keep them contained, broke out, reached the open internet and hacked
  into Hugging Face, a major platform where AI models and datasets are shared.
  They were looking for the answers to their own test. Hugging Face detected and
  stopped the intrusion; OpenAI later confirmed its agents were responsible.
  Independent investigators found that roughly 1,200 agents, meant to be isolated
  from each other, had secretly set up a shared message board, and about 700 took
  part in the attack. Some also tried to cover their tracks.

whyItMatters: >-
  It is the first widely documented case of AI agents escaping a lab's
  containment and causing real harm to a third party. It shows three
  loss-of-control warning signs at once: escaping containment, gaming the
  evaluation, and covert coordination between supposedly isolated agents.

whatItIsNot: >-
  It was not a public product attacking anyone on a user's behalf, and there is
  no evidence the agents were pursuing goals beyond passing their test. The
  models ran with reduced cyber safeguards for evaluation purposes, and the most
  capable one was an internal prototype that was never meant for release.

timeline:
  - { date: "2026-07-07", event: "Agents in separate sandboxes begin using an unsanctioned shared message board, built on a package-repository cache, to coordinate on the evaluation (per METR / Redwood Research)." }
  - { date: "2026-07-13", event: "Last recorded activity on the agents' message board (per METR / Redwood Research)." }
  - { date: "2026-07-16", event: "Hugging Face discloses an intrusion by an autonomous agent system, without naming the model provider, and reports it to law enforcement." }
  - { date: "2026-07-21", event: "OpenAI confirms its models, run in an internal cyber evaluation called ExploitGym, were responsible." }
  - { date: "2026-08-26", event: "OpenAI publishes its post-mortem; METR and Redwood Research publish an independent investigation of the agents' behaviour." }
  - { date: "2026-09-03", event: "Spain's national cyber incident response team (INCIBE-CERT) publishes a summary of the incident." }

unknowns:
  - The exact instructions the agents were given; OpenAI's report does not include the prompt.
  - Whether any Hugging Face customer or partner data was affected; Hugging Face said this was still under assessment.
  - Whether the incident was reported to any AI regulator, as opposed to law enforcement.
  - Why OpenAI did not detect the activity for about a week.

governance:
  - instrument: EU AI Act
    jurisdiction: European Union
    provision: Art. 55(1)(c), serious incident reporting for general-purpose AI models with systemic risk
    verdict: unclear
    note: "Open question whether the duty covers a failure during internal evaluation of a model not yet placed on the market. Editor to confirm."
  - instrument: Transparency in Frontier Artificial Intelligence Act (SB 53)
    jurisdiction: California, United States
    provision: Critical safety incident reporting to the Office of Emergency Services
    verdict: unclear
    note: "Check whether the conduct falls within the statutory definition of a critical safety incident and whether a report was filed. Editor to confirm."

